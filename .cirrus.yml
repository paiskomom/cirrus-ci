task:
  name: "Test Environment Docker Baru"
  timeout_in: 5m
  container:
      image: memedo/paiskomom:knjt
      cpu: 2
      memory: 4G

  Check_System_script:
      - echo "Mengetes Environment Docker..."
      - echo "1. Mengecek Direktori Saat Ini (Harusnya /home/cirrus):"
      - pwd
      - echo "2. Mengecek User Aktif (Harusnya cirrus):"
      - whoami
      - echo "3. Mengecek instalasi alat (pigz, git-lfs, tar):"
      - pigz --version
      - git-lfs --version
      - tar --version
      - echo "4. Mengetes simulasi kompresi ccache (seperti di ziping.sh):"
      - mkdir -p /home/cirrus/ccache
      - touch /home/cirrus/ccache/dummy.txt
      - cd /home/cirrus
      - tar --use-compress-program="pigz -k -1 " -cf ccache.tar.gz ccache
      - ls -lh ccache.tar.gz
      - echo "✅ TES SELESAI DAN SUKSES!"
